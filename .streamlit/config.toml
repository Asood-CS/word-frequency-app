[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#1f1f1d"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&display=swap, serif"
codeFont = "monospace"
baseRadius = "0.6rem"
borderColor = "#e4e2dc"
showWidgetBorder = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
